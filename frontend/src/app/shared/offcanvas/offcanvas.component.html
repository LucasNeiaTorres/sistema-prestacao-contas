<ng-template #offcanvas let-offcanvas>
  <div class="d-flex gap-4 align-items-center px-4 pt-3">
    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      (click)="dismiss()"
    ></button>
  </div>
  <div class="sticky-top">
    <div class="offcanvas-header px-4 bg-white d-flex flex-column">
      <div class="w-100">
        <ng-content select="[appOffcanvasHeader]"></ng-content>
      </div>
    </div>
    <div class="pt-4 app-gradient"></div>
  </div>
  <div class="offcanvas-body pt-0 px-4">
    <div class="overflow-auto">
      <ng-content select="[appOffcanvasBody]"></ng-content>
    </div>
  </div>
</ng-template>
