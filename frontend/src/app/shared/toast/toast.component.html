<!-- toast desktop  -->
<div
  class="d-none d-md-block position-fixed top-0 end-0"
  style="z-index: 9999"
  aria-live="polite"
  aria-atomic="true"
>
  <div *ngFor="let toast of toasts; let i = index" class="mt-3 me-4">
    <ngb-toast
      [delay]="4000"
      [autohide]="true"
      class="text-light col-2 mb-2 border-0 border-radius-lg shadow-sm py-1 ps-2"
      [ngClass]="{
        'bg-success': toast.tipo == 'success',
        'bg-danger': toast.tipo == 'danger'
      }"
    >
      <div class="d-flex no-wrap align-items-center h-100 fw-semibold">
        <i
          class="bi me-3 text-light fs-5"
          [ngClass]="{
            'bi-check-circle-fill': toast.tipo == 'success',
            'bi-exclamation-triangle-fill': toast.tipo == 'danger'
          }"
        >
        </i>
        <!-- <i class="bi bi-radioactive"></i> -->
        {{ toast.msg }}
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          style="font-size: 0.6rem; font-weight: bolder"
          aria-label="Close"
          (click)="closeToast(i)"
        ></button>
      </div>
    </ngb-toast>
  </div>
</div>
