<div class="px-4 h-100 overflow-auto">
  <app-navbar
    [pageTitle]="'Cadastro do Curador'"
    [showActionButton]="false"
    [showSearchButtons]="false"
  ></app-navbar>
  <div class="mt-n4 pb-2 col-lg-10 offset-lg-1 col-md-10 offset-md-1 col-12">
    <router-outlet></router-outlet>
    <!-- 80px do botão fixo -->
    <div class="d-md-none" style="padding-bottom: 80px"></div>
    <button
      [disabled]="form.invalid || isLoading"
      class="btn btn-primary fw-semibold col-xl-2 col-lg-3 col-12 p-2 mt-4 d-none d-md-block"
      (click)="onCadastrar()"
      style="min-width: 170px; height: 48px"
    >
      <div *ngIf="!isLoading && !editMode">Cadastrar Curador</div>
      <div *ngIf="!isLoading && editMode">Alterar Curador</div>
      <span
        *ngIf="isLoading"
        class="spinner-border spinner-border-sm"
        role="status"
        aria-hidden="true"
      ></span>
    </button>
    <!-- mobile button -->
    <div class="fixed-bottom px-4 py-3 bg-white app-shadow d-md-none">
      <button
        [disabled]="form.invalid || isLoading"
        class="btn btn-primary fw-semibold col-12 app-btn-footer"
        (click)="onCadastrar()"
        style="height: 48px"
      >
        <div *ngIf="!isLoading && !editMode">Cadastrar Curador</div>
        <div *ngIf="!isLoading && editMode">Alterar Curador</div>
        <span
          *ngIf="isLoading"
          class="spinner-border spinner-border-sm"
          role="status"
          aria-hidden="true"
        ></span>
      </button>
    </div>
  </div>
</div>
